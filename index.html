<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebXDC Apps Explorer</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 60rem; margin: 0 auto; padding: 1rem; }
  header { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 1.3rem; margin: 0 1rem 0 0; }
  ul { list-style: none; padding: 0; display: grid; gap: 1rem;
       grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); }
  li { border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
       border-radius: .5rem; padding: .75rem; display: flex; flex-direction: column; gap: .4rem; }
  .name { font-weight: 600; display: flex; gap: .5rem; align-items: center;
       text-decoration: none; overflow-wrap: anywhere; }
  .name img { width: 2.5rem; height: 2.5rem; border-radius: .3rem; flex: none;
       background: color-mix(in srgb, currentColor 15%, transparent); }
  .desc { flex: 1; }
  .meta { font-size: .85rem; opacity: .7; display: flex; gap: .75rem; flex-wrap: wrap; }
  a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>WebXDC Apps Explorer</h1>
  <form id="f">
    <label>topic: <input id="q" size="16"></label>
    <button>search</button>
  </form>
</header>
<p id="status" role="status"></p>
<p>Liked an app? Star it to move it up the list!</p>
<ul id="list"></ul>
<p>
  Want to have your own <a href="https://webxdc.org/">WebXDC</a> app here?
  Upload it to <a href="https://github.com/">GitHub</a>
  or <a href="https://codeberg.org/">Codeberg</a>
  and add the <code>webxdc-app</code> tag (topic) to it,
  then make a release with a file named <code>app.xdc</code>. Done!
</p>

<script>
const $ = id => document.getElementById(id);
const topic = () => decodeURIComponent(location.hash.slice(1)) || 'webxdc-app,webxdc';

$('f').onsubmit = e => { e.preventDefault(); location.hash = $('q').value.trim(); };
onhashchange = load;

async function json(url, headers) {
  const res = await fetch(url, { headers });
  // A rate-limited or overloaded forge may answer with HTML instead of JSON.
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);
  return data;
}

// GitHub's search API errors out rather than paging past 1000 results, so this is
// a real ceiling, not just a runaway guard.
const MAX_RESULTS = 1000;

// TODO fix: proper pagination, that can retry later if rate-limited.
// And don't try to load all pages right away.
/**
 * Collect every page, stopping at the first short one. Both forges cap the page
 * size server-side and take a 1-based `page`. While a topic fits on one page this
 * costs no extra request, so it is free until it isn't.
 */
async function pages(url, size, parse, headers) {
  const out = [];
  try {
    for (let page = 1; out.length < MAX_RESULTS; page++) {
      const items = parse(await json(`${url}&page=${page}`, headers));
      out.push(...items);
      if (items.length < size) break;
    }
  } catch (e) {
    if (!out.length) throw e;
    out.error = e;
  }
  return out;
}

// Each source returns repos in one shape. Icons/avatars come from the plain web
// hosts, not the API hosts, so they cost no API rate limit.
const SOURCES = {
  GitHub: t => {
    const size = 100; // search API maximum
    return pages(
      `https://api.github.com/search/repositories?sort=stars&order=desc&per_page=${size}&q=`
        + encodeURIComponent(`topic:${t}`),
      size, d => d.items.map(r => ({
        host: 'GitHub',
        name: r.full_name,
        url: r.html_url,
        desc: r.description,
        stars: r.stargazers_count,
        updated: r.pushed_at,
        topics: r.topics || [],
        icon: `https://raw.githubusercontent.com/${r.full_name}/HEAD/icon.png`,
        avatar: `${r.owner.avatar_url}&s=80`,
      })), { Accept: 'application/vnd.github+json' });
  },
  Codeberg: t => {
    const size = 50; // Forgejo's default MAX_RESPONSE_ITEMS
    return pages(
      `https://codeberg.org/api/v1/repos/search?sort=stars&order=desc&limit=${size}&topic=true&q=`
        + encodeURIComponent(t),
      size, d => d.data.map(r => ({
        host: 'Codeberg',
        name: r.full_name,
        url: r.html_url,
        desc: r.description,
        stars: r.stars_count,
        updated: r.updated_at,
        topics: r.topics || [],
        icon: `${r.html_url}/raw/branch/${r.default_branch}/icon.png`,
        avatar: r.owner.avatar_url,
      })));
  },
};

/**
 * If a repo doesn't have the `webxdc-app` topic, put it after all others.
 *
 * If a repo doesn't have the `webxdc-app` topic but, say, only has `webxdc`,
 * then it might be a WebXDC development tool or something related to that.
 */
function rankRepos(repos) {
  const isApp = r => r.topics.includes('webxdc-app');
  return repos.sort((a, b) => isApp(b) - isApp(a) || b.stars - a.stars);
}

function card(r) {
  const li = document.createElement('li');

  const a = li.appendChild(document.createElement('a'));
  a.className = 'name';
  a.href = r.url;

  const img = a.appendChild(document.createElement('img'));
  img.loading = 'lazy';
  img.alt = '';
  img.src = r.icon;
  img.onerror = () => { img.onerror = null; img.src = r.avatar; };

  a.appendChild(document.createElement('span')).textContent = r.name;

  li.appendChild(document.createElement('div')).textContent = r.desc || '';
  li.lastChild.className = 'desc';

  const meta = li.appendChild(document.createElement('div'));
  meta.className = 'meta';
  meta.appendChild(document.createElement('span')).textContent = `★ ${r.stars}`;

  const updated = meta.appendChild(document.createElement('span'));
  updated.append('updated ');
  const time = updated.appendChild(document.createElement('time'));
  time.dateTime = r.updated;
  time.textContent = r.updated.slice(0, 10);
  const rel = meta.appendChild(document.createElement('a'));
  rel.href = r.url + '/releases/latest';
  rel.textContent = 'latest release';

  return li;
}

async function load() {
  const t = topic();
  $('q').value = t;
  document.title = `WebXDC Apps: ${t}`;
  $('status').textContent = 'loading…';
  $('list').replaceChildren();
  try {
    const names = Object.keys(SOURCES);
    const results = await Promise.allSettled(names.map(n => SOURCES[n](t)));
    const repos = rankRepos(results.flatMap(r => r.value || []));
    // One dead forge still shows the other's results, and a forge that rate-limited
    // part-way still shows the pages it did give us.
    const counts = results.map((r, i) => r.status === 'rejected'
      ? `${names[i]}: failed (${r.reason.message})`
      : `${names[i]}: ${r.value.length}${r.value.error ? ` so far (${r.value.error.message})` : ''}`);
    $('status').textContent = `${repos.length} repos tagged "${t}" — ${counts.join(', ')}`;
    $('list').append(...repos.map(card));
  } catch (e) {
    $('status').textContent = `error: ${e.message}`;
  }
}
load();
</script>
</body>
</html>
