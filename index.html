<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebXDC Apps Explorer</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 60rem; margin: 0 auto; padding: 1rem; }
  header { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 1.3rem; margin: 0 1rem 0 0; }
  ul { list-style: none; padding: 0; display: grid; gap: 1rem;
       grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); }
  li { border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
       border-radius: .5rem; padding: .75rem; display: flex; flex-direction: column; gap: .4rem; }
  .name { font-weight: 600; }
  .desc { flex: 1; }
  .meta { font-size: .85rem; opacity: .7; display: flex; gap: .75rem; flex-wrap: wrap; }
  a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>WebXDC Apps Explorer</h1>
  <form id="f">
    <label>topic: <input id="q" size="16"></label>
    <button>search</button>
  </form>
</header>
<p id="status"></p>
<ul id="list"></ul>

<script>
const $ = id => document.getElementById(id);
const topic = () => decodeURIComponent(location.hash.slice(1)) || 'webxdc';

$('f').onsubmit = e => { e.preventDefault(); location.hash = $('q').value.trim(); };
onhashchange = load;

function card(r) {
  const li = document.createElement('li');

  const a = li.appendChild(document.createElement('a'));
  a.className = 'name';
  a.href = r.html_url;
  a.textContent = r.full_name;

  li.appendChild(document.createElement('div')).textContent = r.description || '';
  li.lastChild.className = 'desc';

  const meta = li.appendChild(document.createElement('div'));
  meta.className = 'meta';
  for (const text of [`★ ${r.stargazers_count}`, `updated ${r.pushed_at.slice(0, 10)}`])
    meta.appendChild(document.createElement('span')).textContent = text;
  const rel = meta.appendChild(document.createElement('a'));
  rel.href = r.html_url + '/releases/latest';
  rel.textContent = 'latest release';

  return li;
}

async function load() {
  const t = topic();
  $('q').value = t;
  document.title = `WebXDC Apps: ${t}`;
  $('status').textContent = 'loading…';
  $('list').replaceChildren();
  try {
    const url = 'https://api.github.com/search/repositories?per_page=100&sort=stars&q='
      + encodeURIComponent(`topic:${t}`);
    const res = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || res.status);
    $('status').textContent = `${data.total_count} repos tagged "${t}"`;
    $('list').append(...data.items.map(card));
  } catch (e) {
    $('status').textContent = `error: ${e.message}`;
  }
}
load();
</script>
</body>
</html>
